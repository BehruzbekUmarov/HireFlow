<!DOCTYPE html>
<html lang="en">
<head>
    <meta charset="UTF-8" />
    <meta name="viewport" content="width=device-width, initial-scale=1.0" />
    <title>HireFlow — Chat Test</title>
    <script src="https://cdnjs.cloudflare.com/ajax/libs/microsoft-signalr/7.0.5/signalr.min.js"></script>
    <style>
        * {
            box-sizing: border-box;
            margin: 0;
            padding: 0;
        }

        body {
            font-family: Arial, sans-serif;
            background: #f0f2f5;
            height: 100vh;
            display: flex;
            flex-direction: column;
        }

        /* Header */
        .header {
            background: #2C3E6B;
            color: white;
            padding: 14px 20px;
            display: flex;
            align-items: center;
            justify-content: space-between;
        }

            .header h1 {
                font-size: 18px;
                font-weight: 600;
            }

            .header .status {
                font-size: 12px;
                background: rgba(255,255,255,0.2);
                padding: 4px 10px;
                border-radius: 99px;
            }

        .status.connected {
            background: #1D9E75;
        }

        .status.disconnected {
            background: #A32D2D;
        }

        /* Layout */
        .container {
            display: flex;
            flex: 1;
            overflow: hidden;
        }

        /* Sidebar */
        .sidebar {
            width: 280px;
            background: white;
            border-right: 1px solid #e0e0e0;
            display: flex;
            flex-direction: column;
        }

        .sidebar-section {
            padding: 16px;
            border-bottom: 1px solid #e0e0e0;
        }

            .sidebar-section h3 {
                font-size: 12px;
                color: #888;
                text-transform: uppercase;
                letter-spacing: 0.5px;
                margin-bottom: 10px;
            }

        .form-group {
            margin-bottom: 10px;
        }

            .form-group label {
                display: block;
                font-size: 12px;
                color: #666;
                margin-bottom: 4px;
            }

            .form-group input {
                width: 100%;
                padding: 8px 10px;
                border: 1px solid #ddd;
                border-radius: 6px;
                font-size: 13px;
            }

        .btn {
            width: 100%;
            padding: 9px;
            border: none;
            border-radius: 6px;
            font-size: 13px;
            cursor: pointer;
            font-weight: 500;
            transition: background 0.15s;
        }

        .btn-primary {
            background: #2C3E6B;
            color: white;
        }

            .btn-primary:hover {
                background: #1a2a4a;
            }

        .btn-success {
            background: #1D9E75;
            color: white;
            margin-top: 6px;
        }

            .btn-success:hover {
                background: #0f7a5a;
            }

        .btn-danger {
            background: #A32D2D;
            color: white;
            margin-top: 6px;
        }

        .btn-sm {
            padding: 5px 10px;
            font-size: 11px;
            border: none;
            border-radius: 4px;
            cursor: pointer;
        }

        /* Token display */
        .token-box {
            background: #f5f5f5;
            border: 1px solid #ddd;
            border-radius: 6px;
            padding: 8px;
            font-size: 10px;
            color: #666;
            word-break: break-all;
            max-height: 60px;
            overflow-y: auto;
            margin-top: 6px;
        }

        /* Chat area */
        .chat-area {
            flex: 1;
            display: flex;
            flex-direction: column;
        }

        .chat-header {
            padding: 14px 20px;
            background: white;
            border-bottom: 1px solid #e0e0e0;
        }

            .chat-header h2 {
                font-size: 15px;
                font-weight: 600;
                color: #2C3E6B;
            }

            .chat-header p {
                font-size: 12px;
                color: #888;
                margin-top: 2px;
            }

        /* Messages */
        .messages {
            flex: 1;
            overflow-y: auto;
            padding: 20px;
            display: flex;
            flex-direction: column;
            gap: 10px;
        }

        .message {
            max-width: 65%;
            display: flex;
            flex-direction: column;
        }

            .message.own {
                align-self: flex-end;
                align-items: flex-end;
            }

            .message.other {
                align-self: flex-start;
                align-items: flex-start;
            }

        .message-bubble {
            padding: 10px 14px;
            border-radius: 18px;
            font-size: 13px;
            line-height: 1.5;
        }

        .message.own .message-bubble {
            background: #2C3E6B;
            color: white;
            border-radius: 18px 18px 4px 18px;
        }

        .message.other .message-bubble {
            background: white;
            color: #333;
            border: 1px solid #e0e0e0;
            border-radius: 18px 18px 18px 4px;
        }

        .message-meta {
            font-size: 10px;
            color: #aaa;
            margin-top: 3px;
            padding: 0 4px;
        }

        .message.own .message-meta {
            text-align: right;
        }

        /* System messages */
        .sys-msg {
            text-align: center;
            font-size: 11px;
            color: #aaa;
            padding: 6px;
        }

        /* Input area */
        .input-area {
            padding: 14px 20px;
            background: white;
            border-top: 1px solid #e0e0e0;
            display: flex;
            gap: 10px;
            align-items: flex-end;
        }

            .input-area textarea {
                flex: 1;
                padding: 10px 14px;
                border: 1px solid #ddd;
                border-radius: 20px;
                font-size: 13px;
                resize: none;
                font-family: Arial, sans-serif;
                outline: none;
                max-height: 100px;
            }

                .input-area textarea:focus {
                    border-color: #2C3E6B;
                }

        .send-btn {
            background: #2C3E6B;
            color: white;
            border: none;
            width: 40px;
            height: 40px;
            border-radius: 50%;
            cursor: pointer;
            font-size: 16px;
            display: flex;
            align-items: center;
            justify-content: center;
            flex-shrink: 0;
        }

            .send-btn:hover {
                background: #1a2a4a;
            }

            .send-btn:disabled {
                background: #ccc;
                cursor: not-allowed;
            }

        /* Unread badge */
        .unread-badge {
            background: #A32D2D;
            color: white;
            font-size: 10px;
            padding: 2px 6px;
            border-radius: 99px;
            margin-left: 6px;
        }

        /* Log area */
        .log {
            padding: 10px;
            background: #1a1a1a;
            color: #00ff88;
            font-family: monospace;
            font-size: 10px;
            height: 100px;
            overflow-y: auto;
        }

        .log-entry {
            margin-bottom: 2px;
        }

            .log-entry.error {
                color: #ff4444;
            }

            .log-entry.info {
                color: #44aaff;
            }

        .placeholder {
            flex: 1;
            display: flex;
            align-items: center;
            justify-content: center;
            color: #aaa;
            font-size: 14px;
            flex-direction: column;
            gap: 8px;
        }

            .placeholder i {
                font-size: 48px;
            }
    </style>
</head>
<body>

    <div class="header">
        <h1>🔥 HireFlow — Chat Test</h1>
        <span class="status disconnected" id="connStatus">Disconnected</span>
    </div>

    <div class="container">
        <!-- Sidebar -->
        <div class="sidebar">

            <!-- Login -->
            <div class="sidebar-section">
                <h3>1. Login</h3>
                <div class="form-group">
                    <label>Email</label>
                    <input type="email" id="loginEmail" placeholder="ali@gmail.com" value="" />
                </div>
                <div class="form-group">
                    <label>Password</label>
                    <input type="password" id="loginPassword" placeholder="••••••••" value="" />
                </div>
                <button class="btn btn-primary" onclick="login()">Login</button>
                <div class="token-box" id="tokenDisplay">Not logged in</div>
            </div>

            <!-- Connect SignalR -->
            <div class="sidebar-section">
                <h3>2. Connect SignalR</h3>
                <button class="btn btn-success" onclick="connectSignalR()" id="connectBtn">Connect</button>
                <button class="btn btn-danger" onclick="disconnectSignalR()" id="disconnectBtn" style="display:none">Disconnect</button>
            </div>

            <!-- Join Conversation -->
            <div class="sidebar-section">
                <h3>3. Join Conversation</h3>
                <div class="form-group">
                    <label>Application ID</label>
                    <input type="number" id="applicationId" placeholder="Enter application ID" value="1" />
                </div>
                <button class="btn btn-primary" onclick="joinConversation()">Join & Load Messages</button>
            </div>

            <!-- API Base URL -->
            <div class="sidebar-section">
                <h3>Settings</h3>
                <div class="form-group">
                    <label>API Base URL</label>
                    <input type="text" id="apiBase" value="http://localhost:5063" />
                </div>
            </div>

            <!-- Log -->
            <div class="log" id="log"></div>
        </div>

        <!-- Chat area -->
        <div class="chat-area">
            <div class="chat-header">
                <h2 id="chatTitle">Select a conversation</h2>
                <p id="chatSubtitle">Login and join a conversation to start chatting</p>
            </div>

            <div class="messages" id="messages">
                <div class="placeholder">
                    <div style="font-size:48px">💬</div>
                    <div>Join a conversation to see messages</div>
                </div>
            </div>

            <div class="input-area">
                <textarea id="messageInput" placeholder="Type a message..." rows="1"
                          onkeydown="handleKeyDown(event)"
                          oninput="autoResize(this)"></textarea>
                <button class="send-btn" onclick="sendMessage()" id="sendBtn" disabled>➤</button>
            </div>
        </div>
    </div>

    <script>
        let token = null;
        let connection = null;
        let currentAppId = null;
        let currentUserId = null;

        function log(msg, type = 'default') {
            const logEl = document.getElementById('log');
            const entry = document.createElement('div');
            entry.className = `log-entry ${type}`;
            entry.textContent = `[${new Date().toLocaleTimeString()}] ${msg}`;
            logEl.appendChild(entry);
            logEl.scrollTop = logEl.scrollHeight;
        }

        function getApiBase() {
            return document.getElementById('apiBase').value.trim();
        }

        // ── Login ────────────────────────────────────────────────
        async function login() {
            const email = document.getElementById('loginEmail').value;
            const password = document.getElementById('loginPassword').value;

            try {
                log(`Logging in as ${email}...`, 'info');
                const res = await fetch(`${getApiBase()}/api/auth/login`, {
                    method: 'POST',
                    headers: { 'Content-Type': 'application/json' },
                    body: JSON.stringify({ email, password })
                });

                if (!res.ok) {
                    const err = await res.json();
                    log(`Login failed: ${err.detail || res.status}`, 'error');
                    return;
                }

                const data = await res.json();
                token = data.accessToken;
                currentUserId = data.id;

                document.getElementById('tokenDisplay').textContent =
                    `✅ ${data.fullName} (${data.role})\n${token.substring(0, 50)}...`;

                log(`Logged in as ${data.fullName} (${data.role})`, 'info');
                document.getElementById('sendBtn').disabled = false;

            } catch (e) {
                log(`Login error: ${e.message}`, 'error');
            }
        }

        // ── SignalR ──────────────────────────────────────────────
        async function connectSignalR() {
            if (!token) { log('Login first!', 'error'); return; }

            const hubUrl = `${getApiBase()}/hubs/chat`;
            log(`Connecting to ${hubUrl}...`, 'info');

            connection = new signalR.HubConnectionBuilder()
                .withUrl(hubUrl, {
                    accessTokenFactory: () => token
                })
                .withAutomaticReconnect()
                .configureLogging(signalR.LogLevel.Warning)
                .build();

            // Listen for new messages
            connection.on("NewMessage", (message) => {
                log(`New message received from ${message.senderName}`, 'info');
                appendMessage(message, message.senderId === currentUserId);
            });

            connection.onreconnecting(() => {
                setStatus('Reconnecting...', false);
                log('Reconnecting...', 'error');
            });

            connection.onreconnected(() => {
                setStatus('Connected', true);
                log('Reconnected!', 'info');
            });

            connection.onclose(() => {
                setStatus('Disconnected', false);
                log('Disconnected');
            });

            try {
                await connection.start();
                setStatus('Connected', true);
                log('SignalR connected!', 'info');
                document.getElementById('connectBtn').style.display = 'none';
                document.getElementById('disconnectBtn').style.display = 'block';
            } catch (e) {
                log(`Connection failed: ${e.message}`, 'error');
            }
        }

        async function disconnectSignalR() {
            if (connection) {
                await connection.stop();
                connection = null;
            }
            setStatus('Disconnected', false);
            document.getElementById('connectBtn').style.display = 'block';
            document.getElementById('disconnectBtn').style.display = 'none';
        }

        function setStatus(text, connected) {
            const el = document.getElementById('connStatus');
            el.textContent = text;
            el.className = `status ${connected ? 'connected' : 'disconnected'}`;
        }

        // ── Join Conversation ────────────────────────────────────
        async function joinConversation() {
            if (!token) { log('Login first!', 'error'); return; }

            currentAppId = parseInt(document.getElementById('applicationId').value);
            if (!currentAppId) { log('Enter an application ID', 'error'); return; }

            // Load existing messages via REST
            try {
                log(`Loading conversation ${currentAppId}...`, 'info');
                const res = await fetch(
                    `${getApiBase()}/api/applications/${currentAppId}/messages`, {
                    headers: { 'Authorization': `Bearer ${token}` }
                });

                if (!res.ok) {
                    const err = await res.json();
                    log(`Failed: ${err.detail || res.status}`, 'error');
                    return;
                }

                const data = await res.json();

                document.getElementById('chatTitle').textContent =
                    `${data.jobTitle} — ${data.companyName}`;
                document.getElementById('chatSubtitle').textContent =
                    `Freelancer: ${data.freelancerName} · ${data.unreadCount} unread`;

                // Clear and render messages
                const container = document.getElementById('messages');
                container.innerHTML = '';

                if (data.messages.length === 0) {
                    container.innerHTML =
                        '<div class="sys-msg">No messages yet. Start the conversation!</div>';
                } else {
                    data.messages.forEach(m => appendMessage(m, m.isOwnMessage));
                }

                log(`Loaded ${data.messages.length} messages`, 'info');

                // Join SignalR group if connected
                if (connection && connection.state === 'Connected') {
                    await connection.invoke("JoinConversation", currentAppId);
                    log(`Joined SignalR group for application ${currentAppId}`, 'info');
                }

                // Mark as read
                await markAsRead();

            } catch (e) {
                log(`Error: ${e.message}`, 'error');
            }
        }

        // ── Send Message ─────────────────────────────────────────
        async function sendMessage() {
            if (!token) { log('Login first!', 'error'); return; }
            if (!currentAppId) { log('Join a conversation first!', 'error'); return; }

            const content = document.getElementById('messageInput').value.trim();
            if (!content) return;

            try {
                const res = await fetch(
                    `${getApiBase()}/api/applications/${currentAppId}/messages`, {
                    method: 'POST',
                    headers: {
                        'Authorization': `Bearer ${token}`,
                        'Content-Type': 'application/json'
                    },
                    body: JSON.stringify({ content })
                });

                if (!res.ok) {
                    const err = await res.json();
                    log(`Send failed: ${err.detail || res.status}`, 'error');
                    return;
                }

                // Clear input
                document.getElementById('messageInput').value = '';
                document.getElementById('messageInput').style.height = 'auto';

                // Message will appear via SignalR NewMessage event
                // If SignalR not connected, add manually
                if (!connection || connection.state !== 'Connected') {
                    const msg = await res.json();
                    appendMessage(msg, true);
                }

            } catch (e) {
                log(`Error: ${e.message}`, 'error');
            }
        }

        async function markAsRead() {
            if (!token || !currentAppId) return;
            await fetch(
                `${getApiBase()}/api/applications/${currentAppId}/messages/read`, {
                method: 'PATCH',
                headers: { 'Authorization': `Bearer ${token}` }
            });
        }

        // ── UI Helpers ───────────────────────────────────────────
        function appendMessage(msg, isOwn) {
            const container = document.getElementById('messages');

            // Remove placeholder if exists
            const placeholder = container.querySelector('.placeholder, .sys-msg');
            if (placeholder) placeholder.remove();

            const div = document.createElement('div');
            div.className = `message ${isOwn ? 'own' : 'other'}`;

            const time = new Date(msg.sentAt).toLocaleTimeString([], {
                hour: '2-digit', minute: '2-digit'
            });

            div.innerHTML = `
                <div class="message-bubble">${escapeHtml(msg.content)}</div>
                <div class="message-meta">${isOwn ? 'You' : msg.senderName} · ${time}</div>
            `;

            container.appendChild(div);
            container.scrollTop = container.scrollHeight;
        }

        function escapeHtml(text) {
            return text
                .replace(/&/g, '&amp;')
                .replace(/</g, '&lt;')
                .replace(/>/g, '&gt;');
        }

        function handleKeyDown(e) {
            if (e.key === 'Enter' && !e.shiftKey) {
                e.preventDefault();
                sendMessage();
            }
        }

        function autoResize(el) {
            el.style.height = 'auto';
            el.style.height = Math.min(el.scrollHeight, 100) + 'px';
        }
    </script>
</body>
</html>
